name: secret-scanning
on:
  push:
    branches:
      - demo
    paths-ignore:
      - 'README.md'
jobs:
  devsecops_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # --- REQUIRED STEP FOR PYTHON ENVIRONMENT ---
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- REQUIRED STEP TO RECONCILE SNYK-OS-PYTHON-0013 ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          # Split multiple flags properly instead of grouping them inside one string
          args: --file=requirement.txt --package-manager=pip
