name: devsecops-pipeline
on: 
  push:
    branches:
      - 'demo'
    paths-ignore:
      - '**/README.md'

permissions:
  contents: read
  packages: write
  id-token: write        # needed for signing the images with GitHub OIDC Token
  security-events: write # required for uploading SARIF scan metrics to the Security tab
  
jobs:
  # JOB 1: Application Security Scanning
  devsecops-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        
    - name: Secret Scanning
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8.2.1 
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/python@master
      continue-on-error: true 
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}        
      with:
        command: test
        args: '["--file=requirements.txt", "--package-manager=pip"]'

  # # JOB 2: Infrastructure as Code (IaC) Security Scanning (Runs in parallel with Job 1)
  # infra-pipeline:
  #   runs-on: ubuntu-latest
  #   steps:
  #   - name: Code Checkout
  #     uses: actions/checkout@v7
  #     with:
  #       fetch-depth: 0

  #   - name: Checkov GitHub Action
  #     uses: bridgecrewio/checkov-action@v12
  #     with:
  #       output_format: cli,sarif
  #       output_file_path: console,results.sarif
  #       soft_fail: true

  #   - name: Upload SARIF file to GitHub Security tab
  #     uses: github/codeql-action/upload-sarif@v4
  #     if: success() || failure()
  #     with:
  #       sarif_file: results.sarif

  #   - name: Upload Scan Artifact
  #     uses: actions/upload-artifact@v4
  #     with:
  #       name: checkov-report
  #       path: results.sarif

  # JOB 3: Container Build and Vulnerability Check 
  # This waits until BOTH application and infrastructure scans pass successfully
  docker-pipeline:
    needs: [devsecops-pipeline, infra-pipeline]
    runs-on: ubuntu-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Dockerfile Linting
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        ignore: DL4000

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }} 
        password: ${{ secrets.DOCKERHUB_TOKEN }} # As per use case create docker PAT token now it is custom

    - name: Docker Build
      run: docker build --no-cache -t ${{ secrets.DOCKERHUB_USERNAME }}/helloworld-demo-python:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/helloworld-demo-python:latest .

    - name: Docker Images
      run: docker images

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/helloworld-demo-python:latest'
        format: 'sarif'
        exit-code: '0'
        ignore-unfixed: true
        output: 'trivy-results.sarif'

    - name: Upload Vulnerability Scan Results
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report
        path: trivy-results.sarif
        retention-days: 30
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'

    - name: SBOM Generation with Syft
      uses: anchore/sbom-action@v0.23.0
      with:
         image: '${{ secrets.DOCKERHUB_USERNAME }}/helloworld-demo-python:latest'
         format: spdx-json
         artifact-name: sbom.spdx.json

    - name: Install Cosign
      uses: sigstore/cosign-installer@v4.1.0
      
    - name: Check install!
      run: cosign version

    - name: Docker Push
      run: |
         docker push ${{ secrets.DOCKERHUB_USERNAME }}/helloworld-demo-python:${{ github.sha }}
         docker push ${{ secrets.DOCKERHUB_USERNAME }}/helloworld-demo-python:latest

    - name: Get Image Digest
      id: digest
      run: |
        DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ secrets.DOCKERHUB_USERNAME }}/helloworld-demo-python:${{ github.sha }})
        echo "digest=$DIGEST" >> $GITHUB_OUTPUT

    - name: Docker Container
      run: docker run -d ${{ secrets.DOCKERHUB_USERNAME }}/helloworld-demo-python:latest 

    - name: Docker Container Lists
      run: docker ps

  # JOB 4: Kubernetes Cluster Setup and Testing
  k8s-pipeline:
    needs: docker-pipeline
    runs-on: ubuntu-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: start minikube
      id: minikube
      uses: medyagh/setup-minikube@latest

    - name: Try the cluster
      run: kubectl get pods -A

    - name: Run Kube-Bench
      run: |
        kubectl delete job kube-bench --ignore-not-found=true
        kubectl apply -f https://raw.githubusercontent.com/aquasecurity/kube-bench/refs/heads/main/job.yaml
        kubectl wait --for=condition=complete job/kube-bench --timeout=180s
        echo "======= Kube-bench Results ====="
        kubectl logs job/kube-bench

    - name: Create Deployment and Service
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl wait --for=condition=ready pod -l app=helloworld

    - name: View Deployment and Service
      run: |
        kubectl get deployments
        kubectl get service   
      
    - name: Test service URLs
      run: |
        minikube service list
        minikube service helloworld --url
        echo "---------------- Opening the service -------------"
        curl $(minikube service helloworld --url)
